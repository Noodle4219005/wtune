# NCAR VAPOR 3.9 (3-D WRF visualization) in its own spack environment, separate from
# envs/postproc: vapor needs proj@:7 while MET needs proj 8, so `unify` cannot hold both
# (decision 0056). No official linux-aarch64 build exists (ncar-vapor conda channel: linux-64 and
# osx only; the AppImage is x86_64), so scc (GH200) builds it from source here.
# scc has no GL/EGL/X11 -dev headers on any node, so the X11/GL/Qt5 stack is built by spack too.
spack:
  specs:
  - vapor@3.9.3 ~doc
  view:
    default:
      root: .spack-env/view
      link: roots
  concretizer:
    unify: true
    reuse: false   # reuse pulled the site /usr python/curl externals back in (envs/postproc)
  packages:
    # the site /usr externals have -dev headers on the login node only (envs/postproc jobs 1577/1578)
    openssl::
      buildable: true
    curl::
      buildable: true
    python::
      buildable: true
      require:
      - '@3.10'        # vapor pins py-numpy@1.21, which supports python <= 3.10
    proj:
      require:
      - '~curl'
    netcdf-c:
      require:
      - '~blosc ~mpi ~parallel-netcdf'
    hdf5:
      require:
      - '~mpi'
