# Public build (Codeberg Pages): tutorial only, no developer notes, no link to the private repo.
INHERIT: mkdocs.yml
site_url: https://noodlesk.codeberg.page/wtune-docs/
site_dir: site/public
repo_url: null
repo_name: null

exclude_docs: |
  /REVIEW_MAP.md
  /WTUNE_RUN.md
  /CODE_STYLE.md
  /figures/

nav:
  - 首頁: index.md
  - 教學:
      - 1. 安裝: tutorial/install.md
      - 2. 第一次跑完整流程: tutorial/quickstart.md
      - 3. Project 資料夾: tutorial/project.md
      - 4. 調校 (tune): tutorial/tune.md
      - 5. 執行與監看 (run / watch): tutorial/run.md
      - 6. 後處理 (post): tutorial/post.md
  - 進階:
      - 自動改什麼、只建議什麼: guide/compliance.md
      - 提交前檢查與時間預測: guide/predict.md
      - 用 YAML 限制搜尋空間: guide/config.md
      - 建議類指令: guide/advice.md
      - WRF 擴展: guide/extensions.md
      - 常見問題與已知限制: guide/faq.md
  - 參考:
      - 指令總表: reference/cli.md
      - 環境變數: reference/env.md
