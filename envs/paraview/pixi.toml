[workspace]
name = "wtune-paraview"
description = "ParaView for `wtune post` (headless pvbatch). From conda-forge rather than spack: spack's ParaView +python needs a spack-built python, and python@3.14.5 does not compile with GCC 15 on scc (Py_ARRAY_LENGTH 'initializer element is not constant', job 1578). The conda-forge linux-aarch64 build is Qt6 + EGL (glvnd), so offscreen rendering uses the node's NVIDIA EGL."
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
paraview = "6.1.1.*"
# the paraview 6.1.1 aarch64 build links libhdf5.so.310 (hdf5 1.14) but does not pin it;
# unpinned, the solver picks hdf5 with libhdf5.so.320 and pvbatch fails to load
hdf5 = "1.14.*"
